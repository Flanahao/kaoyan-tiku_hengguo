<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>思维导图沙箱 (Mindmap Sandbox)</title>
  <link rel="stylesheet" href="css/simpleMindMap.min.css">
  <link rel="stylesheet" href="../lib/katex/katex.min.css">
  <link rel="stylesheet" href="css/sandbox.css">
  <link rel="stylesheet" href="css/outliner.css">
</head>
<body>
  <!-- 全屏导图挂载容器 -->
  <div id="mindMapContainer"></div>

  <!-- 大纲笔记挂载容器 -->
  <div id="outlinerContainer"></div>

  <!-- 顶部悬浮控制栏 -->
  <header class="floating-toolbar">
    <div class="toolbar-title">
      <span>思维导图</span>
    </div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" id="btnInsertChild" title="插入子节点 (Tab)">
        <span>子节点</span>
        <kbd>Tab</kbd>
      </button>
      <button type="button" class="tool-btn" id="btnInsertSibling" title="插入同级节点 (Enter)">
        <span>同级节点</span>
        <kbd>Enter</kbd>
      </button>
      <button type="button" class="tool-btn" id="btnDeleteNode" title="删除选中节点及其子树 (Delete)">
        <span>删除</span>
        <kbd>Del</kbd>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" id="btnUndo" title="撤销操作 (Ctrl+Z)">
        <span>撤销</span>
        <kbd>Ctrl+Z</kbd>
      </button>
      <button type="button" class="tool-btn" id="btnRedo" title="重做操作 (Ctrl+Y)">
        <span>重做</span>
        <kbd>Ctrl+Y</kbd>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" id="btnResetView" title="重置视口到中心">
        <span>居中</span>
      </button>
      <button type="button" class="tool-btn" id="btnFitView" title="自适应画布大小">
        <span>自适应</span>
      </button>
      <button type="button" class="tool-btn" id="btnExpandAll" title="全部展开 (Alt+Shift+.)">
        <span>全部展开</span>
      </button>
      <button type="button" class="tool-btn" id="btnCollapseAll" title="全部折叠 (Alt+Shift+.)">
        <span>全部折叠</span>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" id="btnExportJson" title="导出思维导图数据为 JSON">
        <span>导出</span>
      </button>
      <button type="button" class="tool-btn" id="btnImportJson" title="导入 JSON 思维导图数据">
        <span>导入</span>
      </button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;">
    </div>
  </header>

  <!-- 根目录复用 Marked / KaTeX / DOMPurify 与 MarkdownLatexEngine (零重复依赖) -->
  <script src="../lib/dompurify/purify.min.js"></script>
  <script src="../lib/marked/marked.umd.min.js"></script>
  <script src="../lib/katex/katex.min.js"></script>
  <script src="../lib/katex/contrib/auto-render.min.js"></script>
  <script src="../js/markdown_latex.js"></script>

  <!-- 独立 Vendor 库及思维导图工具集脚本 -->
  <script src="js/vendor/simpleMindMap.umd.min.js"></script>
  <script src="js/default_data.js"></script>
  <script src="js/mindmap_drag_enhancer.js"></script>
  <script src="js/mindmap_node_renderer.js"></script>
  <script src="js/mindmap_node_editor.js"></script>
  <script src="js/mindmap_outliner.js"></script>
  <script src="js/dual_view_controller.js"></script>
  <script src="js/mindmap_shortcut_drawer.js"></script>
  <script src="js/mindmap_bottom_toolbar.js"></script>
  <script src="js/mindmap_structure_controller.js"></script>
  <script src="js/mindmap_shortcut_manager.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
