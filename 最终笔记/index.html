<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>最终笔记 · 第1章 函数与极限</title>
  <link rel="stylesheet" href="../lib/katex/katex.min.css" />
  <link rel="stylesheet" href="../lib/mind-elixir/MindElixir.css" />
  <link rel="stylesheet" href="css/note.css" />
</head>
<body>
  <div id="app" data-view="note" class="layout side-collapsed">
    <aside class="side" id="side">
      <div class="brand">最终笔记</div>
      <div class="brand-sub">考研数学 · 知识点正文</div>
      <div id="chapters"></div>
      <nav id="toc" aria-label="目录"></nav>
    </aside>

    <div class="main">
      <div class="topbar">
        <button type="button" class="btn icon-btn" id="btn-side" title="展开/收起目录">☰</button>
        <div class="view-switch" role="group" aria-label="呈现方式">
          <button type="button" class="btn" data-view-btn="note">笔记</button>
          <button type="button" class="btn" data-view-btn="tree">知识树</button>
          <button type="button" class="btn" data-view-btn="split">分屏</button>
        </div>
        <button type="button" class="btn" id="btn-theme" title="切换明暗">主题</button>
      </div>

      <div id="panes" class="panes">
        <section id="note-pane" class="note-pane">
          <div class="doc-header">
            <div class="chapter-no" id="chapter-no"></div>
            <h1 id="doc-title"></h1>
            <div class="sub" id="doc-sub"></div>
          </div>
          <div id="toc-mobile" class="toc-mobile"></div>
          <article class="content" id="content">
            <p>加载中…</p>
          </article>
        </section>

        <section id="tree-pane" class="tree-pane hidden">
          <div class="tree-toolbar">
            <div class="tree-hint">拖动画布平移 · 滚轮缩放 · 点击节点选中并联动正文</div>
          </div>
          <div id="mind-map" class="mind-map"></div>
          <aside id="node-detail" class="node-detail">
            <div class="nd-empty">选中树节点后，此处显示知识点信息</div>
          </aside>
        </section>
      </div>
    </div>
  </div>

  <script src="../lib/marked/marked.umd.min.js"></script>
  <script src="../lib/dompurify/purify.min.js"></script>
  <script src="../lib/katex/katex.min.js"></script>
  <script src="../lib/katex/contrib/auto-render.min.js"></script>
  <script src="../js/markdown_latex.js"></script>
  <script src="js/data.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/md-to-graph.js"></script>
  <script src="js/me-adapter.js"></script>
  <script src="../lib/mind-elixir/MindElixir.iife.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
